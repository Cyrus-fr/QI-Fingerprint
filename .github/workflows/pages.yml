name: Deploy site to GitHub Pages

# The site is a Next.js static export with no server runtime, so Pages only ever
# serves files. Building here rather than committing `site/out` keeps the export
# out of the history and guarantees the published page matches the source in the
# same commit.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one that is mid-flight: a cancelled
# deploy can leave the site on a half-published version.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # Before the build, not after: the build reads this step's base_path, and a
      # project page is served from /<repo> rather than the domain root. Without
      # it every /_next/ URL would 404 in production while working on localhost.
      # Pages itself is already enabled on the repository, in workflow build mode.
      # This step does not try to create it: GITHUB_TOKEN cannot create a Pages
      # site while the repository's default workflow permission is read-only, and
      # `enablement: true` fails the run with "Resource not accessible by
      # integration". All this step does now is report the base path.
      - uses: actions/configure-pages@v5
        id: pages

      - run: npm ci

      - run: npm run typecheck

      - name: Build the static export
        run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
